<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your order · Scene</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1b1b1b; --muted:#6b6b66; --line:#e6e4de; --accent:#0a6cff; --ok:#1a7f45; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --card:#1b1b1b; --ink:#f2f2ef; --muted:#9a9a94; --line:#2c2c2a; --accent:#5b9bff; --ok:#4cc27d; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 20px 16px 40px; }
  .eyebrow { color:var(--muted); font-size:13px; letter-spacing:.04em; text-transform:uppercase; }
  h1 { margin:4px 0 2px; font-size:26px; }
  .place { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; }
  .total { border-top:1px solid var(--line); margin-top:8px; padding-top:10px; font-weight:700; }
  .btn { display:block; text-align:center; padding:14px; border-radius:12px; background:var(--accent); color:#fff; font-weight:700; text-decoration:none; }
  .wait { color:var(--muted); text-align:center; padding:8px 0; }
  ol { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:12px; padding:10px 0; color:var(--muted); }
  li .dot { width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:none; }
  li.done { color:var(--ink); } li.done .dot { background:var(--ok); border-color:var(--ok); }
  li.now { color:var(--ink); font-weight:700; } li.now .dot { border-color:var(--accent); animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); } }
  @media (prefers-reduced-motion: reduce) { li.now .dot { animation:none; } }
  .fine { color:var(--muted); font-size:13px; text-align:center; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Scene order</div>
  <h1 id="title">Loading…</h1>
  <p class="place" id="place"></p>

  <section class="card" id="items" aria-label="Items"></section>

  <section class="card" id="action" aria-live="polite"></section>

  <section class="card" id="track" aria-label="Progress" hidden>
    <ol id="steps"></ol>
  </section>

  <p class="fine">Demo kitchen · Stripe test mode · Prices come from the web and may differ at the store.</p>
</main>
<script>
const id = location.pathname.split('/').filter(Boolean).pop();
const $ = s => document.getElementById(s);
const usd = c => '$' + (c / 100).toFixed(2);
const STAGES = ['received', 'preparing', 'ready'];
const LABEL = { received: 'Order received', preparing: 'Preparing your food', ready: 'Ready for pickup' };

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k));
  return n;
}

function render(o) {
  $('title').textContent = o.stage === 'ready' ? 'Your order is ready' : o.stage === 'rejected' ? 'Order cancelled' : 'Your order';
  $('place').textContent = o.place_name + ' · ' + o.address;
  const items = $('items'); items.replaceChildren();
  o.items.forEach(i => items.append(el('div', { className: 'row' }, el('span', { textContent: i.qty + '× ' + i.name }), el('span', { textContent: usd(i.price_cents * i.qty) }))));
  items.append(el('div', { className: 'row total' }, el('span', { textContent: 'Total' }), el('span', { textContent: usd(o.total_cents) })));

  const act = $('action'); act.replaceChildren();
  const paid = STAGES.includes(o.stage);
  if (o.stage === 'awaiting_approval') act.append(el('div', { className: 'wait', textContent: 'Waiting for you to approve this on your glasses.' }));
  else if (o.stage === 'awaiting_payment') act.append(el('a', { className: 'btn', href: o.url, textContent: 'Pay ' + usd(o.total_cents) + ' with Stripe' }));
  else if (o.stage === 'rejected') act.append(el('div', { className: 'wait', textContent: 'This order was not placed.' }));
  else act.append(el('div', { className: 'wait', textContent: 'Paid. Thank you!' }));

  const track = $('track'); track.hidden = !paid;
  if (paid) {
    const at = STAGES.indexOf(o.stage);
    const steps = $('steps'); steps.replaceChildren();
    STAGES.forEach((s, i) => steps.append(el('li', { className: i < at || o.stage === 'ready' ? 'done' : i === at ? 'now' : '' },
      el('span', { className: 'dot' }), el('span', { textContent: LABEL[s] }))));
  }
}

async function poll() {
  try {
    const r = await fetch('/orders/' + id);
    if (!r.ok) throw new Error(r.status);
    const o = await r.json();
    render(o);
    if (o.stage === 'ready' || o.stage === 'rejected') return;
  } catch { $('title').textContent = 'Reconnecting…'; }
  setTimeout(poll, 2000);
}
poll();
</script>
</body>
</html>
