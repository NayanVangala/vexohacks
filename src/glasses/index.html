<!doctype html>
<!--
  Scene for Meta Ray-Ban Display (Web App, 600x600, additive display: black = transparent).
  Served by the Scene backend at /glasses/, so every fetch is same-origin.
  Input: the Meta Neural Band IS the controller: its D-pad gestures arrive as arrow keys
  (move focus) and its pinch as Enter/click (activate). Everything here works with the band
  alone, including asking questions, so Scene still works when voice doesn't.
  Add once in Meta AI > Devices > Display Glasses settings > App connections > Web apps,
  URL = https://<your tunnel>/glasses/
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Plain HTML first: if the script can't run, this still shows, so the screen is never blank. -->
<div id="app" aria-live="polite">
  <header><h1>Scene</h1></header>
  <div class="card"><div class="title">Loading…</div><div class="body">Connecting to your laptop.</div></div>
</div>
<script src="app.js"></script>
</body>
</html>
