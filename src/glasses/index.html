<!doctype html>
<!--
  Scene for Meta Ray-Ban Display (Web App, 600x600, additive display: black = transparent).
  Served by the Scene backend at /glasses/, so every fetch is same-origin.
  Input: the Meta Neural Band IS the controller: its D-pad gestures arrive as arrow keys
  (move focus) and its pinch as Enter/click (activate). Everything here works with the band
  alone, including asking questions, so Scene still works when voice doesn't.
  Add once in Meta AI > Devices > Display Glasses settings > App connections > Web apps,
  URL = https://<your tunnel>/glasses/
  Home is a stacked bubble list (newest at the bottom, max 4 visible); a small Scene logo
  + Live dot stays in the header on every screen, and full detail lives on the phone.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EC6A63">
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Plain HTML first: if the script can't run, this still shows, so the screen is never blank. -->
<div id="app" aria-live="polite">
  <header><h1>Scene</h1></header>
  <div class="calm-line">Connecting to your laptop…</div>
</div>
<script src="app.js"></script>
<script src="scene-views.js"></script>
<script src="followthrough.js"></script>
</body>
</html>
